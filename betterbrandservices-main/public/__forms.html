<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Better Brand Services Form</title></head>
  <body>
    <form name="better-brand-contact" method="POST" action="/__forms.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="better-brand-contact">
      <input type="hidden" name="subject" value="New Better Brand Services inquiry" data-remove-prefix>
      <input name="bot-field" tabindex="-1" autocomplete="off">
      <input name="name" required>
      <input name="email" type="email" required>
      <input name="phone" type="tel">
      <select name="service" required><option>Logo Design</option></select>
      <textarea name="message" required></textarea>
    </form>
  </body>
</html>
