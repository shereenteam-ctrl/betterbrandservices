<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your BBS sign-in code</title>
  </head>
  <body style="margin:0;background:#07111f;color:#eef7ff;font-family:Arial,sans-serif;padding:32px 16px">
    <main style="max-width:520px;margin:0 auto;background:#0d1a2b;border:1px solid #203650;border-radius:20px;padding:36px;text-align:center">
      <p style="margin:0 0 12px;color:#7db9ff;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">Better Brand Services</p>
      <h1 style="margin:0 0 12px;font-size:28px">Your sign-in code</h1>
      <p style="margin:0 0 26px;color:#a9bad0;line-height:1.6">Enter this four-digit code in the BBS AI Builder. It expires in 10 minutes.</p>
      <div style="display:inline-block;padding:18px 28px;border-radius:14px;background:#07111f;color:#ffffff;font-size:36px;font-weight:800;letter-spacing:.24em">{{ .Data.bbs_auth_code }}</div>
      <p style="margin:28px 0 0;color:#71849c;font-size:12px;line-height:1.6">If you did not request this code, you can ignore this email.</p>
    </main>
  </body>
</html>
